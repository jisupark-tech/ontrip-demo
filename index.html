<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- All relative: the app is served from a sub-path, and an origin-root
         href 404s there, which is how the manifest and the service worker both
         came to be silently absent in production. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>ontrip — Seoul, right now</title>
    <script type="module" crossorigin src="/ontrip-demo/assets/index-BJ-eaXvP.js"></script>
    <link rel="stylesheet" crossorigin href="/ontrip-demo/assets/index-B8NzZsu0.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Relative, not '/sw.js': this ships under /ontrip-demo/, where an
          // origin-root path 404s and the worker silently never registers.
          navigator.serviceWorker.register('sw.js').catch(function () {})
        })
      }
    </script>
  </body>
</html>
